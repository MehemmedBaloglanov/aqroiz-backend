spring:
  application:
    name: aqroiz
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aqroiz}
    username: ${DB_USER:aqroiz}
    password: ${DB_PASSWORD:aqroiz}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

aqroiz:
  time:
    business-zone: Asia/Baku
  security:
    jwt:
      # Lokal inkişaf üçün. Prod-da mütləq AQROIZ_JWT_SECRET mühit dəyişəni ilə verilir.
      secret: ${AQROIZ_JWT_SECRET:dev-only-secret-change-me-0123456789-abcdef}
      ttl: PT12H
      issuer: aqroiz
  dev-data:
    enabled: false